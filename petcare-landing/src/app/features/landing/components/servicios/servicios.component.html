<section id="servicios" class="servicios">
  <div class="servicios__container">
    <span class="servicios__tag">Nuestros Servicios</span>
    <h2 class="servicios__title">Todo para el cuidado de tu mascota</h2>
    <p class="servicios__subtitle">
      Servicios veterinarios y de estética con profesionales certificados.
    </p>

    <div class="servicios__grid">
      <article class="servicio-card" *ngFor="let s of servicios">
        <div class="servicio-card__icon">{{ s.icono }}</div>
        <h3>{{ s.titulo }}</h3>
        <p>{{ s.descripcion }}</p>
        <span class="servicio-card__price">{{ s.precio }}</span>
      </article>
    </div>
  </div>
</section>
